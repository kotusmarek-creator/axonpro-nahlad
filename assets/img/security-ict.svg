<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560">
  <!-- illustration: Bezpečnosť – riešenia pre IKT (audits, documentation, configuration, vulnerability testing, identity) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF5FA"/><stop offset="1" stop-color="#F6FAFC"/>
    </linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1590B5"/><stop offset="1" stop-color="#005A77"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F2E" flood-opacity=".10"/>
    </filter>
  </defs>
  <!-- no background rectangle: the page card behind it provides the tint -->

  <!-- soft background shapes -->
  <circle cx="230" cy="270" r="170" fill="#D9EEF5" opacity=".45"/>
  <circle cx="1060" cy="280" r="170" fill="#D9EEF5" opacity=".45"/>
  <circle cx="640" cy="285" r="232" fill="#DDEFF6"/>
  <circle cx="60" cy="480" r="34" fill="#D9EEF5" opacity=".7"/>
  <circle cx="1230" cy="70" r="30" fill="#D9EEF5" opacity=".7"/>
  <circle cx="640" cy="285" r="198" fill="none" stroke="#7CC6DC" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round"/>

  <!-- network links -->
  <g fill="none" stroke="#7CC6DC" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round">
    <path d="M640 285L402 152L235 155L205 395L402 386L640 285"/>
    <path d="M640 285L878 152L1075 155L1080 400L878 392L640 285"/>
  </g>
  <g fill="#fff" stroke="#7CC6DC" stroke-width="3">
