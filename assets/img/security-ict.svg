  <g filter="url(#sh)"><rect x="338" y="344" width="128" height="88" rx="18" fill="#fff"/></g>
  <circle cx="374" cy="380" r="18" fill="#DDEFF6"/>
  <circle cx="374" cy="374" r="7" fill="#1590B5"/>
  <path d="M362 392a12 10 0 0 1 24 0z" fill="#1590B5"/>
  <path d="M402 374h46M402 388h30M354 412h50" stroke="#D9EEF5" stroke-width="7" stroke-linecap="round"/>
