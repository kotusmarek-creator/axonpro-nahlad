  <rect x="1000" y="90" width="72" height="10" rx="5" fill="#1590B5"/>
  <circle cx="1010" cy="130" r="10" fill="#2FBFAE"/><path d="M1005.5 130l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1010" cy="166" r="10" fill="#2FBFAE"/><path d="M1005.5 166l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1010" cy="202" r="10" fill="#F5B041"/><path d="M1010 197v5" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="1010" cy="207" r="1.7" fill="#fff"/>
  <path d="M1032 130h116M1032 166h92M1032 202h104" stroke="#D9EEF5" stroke-width="8" stroke-linecap="round"/>

