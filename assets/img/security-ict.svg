  <path d="M1008 450h144" stroke="#D9EEF5" stroke-width="4" stroke-linecap="round"/>
  <rect x="1015" y="406" width="22" height="40" rx="5" fill="#7CC6DC"/>
  <rect x="1051" y="384" width="22" height="62" rx="5" fill="#1590B5"/>
  <rect x="1087" y="396" width="22" height="50" rx="5" fill="#7CC6DC"/>
  <rect x="1123" y="362" width="22" height="84" rx="5" fill="#007194"/>

  <!-- sparkles -->
  <g fill="#1590B5">
    <circle cx="560" cy="62" r="4"/><circle cx="742" cy="510" r="4"/><circle cx="318" cy="280" r="3"/>
    <circle cx="960" cy="272" r="3" fill="#2FBFAE"/><circle cx="110" cy="240" r="4" fill="#2FBFAE"/>
    <circle cx="1206" cy="300" r="4"/><circle cx="500" cy="500" r="3" fill="#2FBFAE"/>
    <path d="M752 58l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#7CC6DC"/>
    <path d="M520 470l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#7CC6DC"/>
    <path d="M1212 470l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#7CC6DC"/>
    <path d="M96 90l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#7CC6DC"/>
