<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!-- card graphic: CEHZ. Content in 0..640; background extends to -400..1040 for the wide variant -->
  <defs>
    <linearGradient id="bg" x1="-400" y1="0" x2="1040" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF5FA"/><stop offset="1" stop-color="#F6FAFC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F2E" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect x="-400" y="0" width="1440" height="300" fill="url(#bg)"/>
  <!-- outer decor for the wide variant -->
  <circle cx="-200" cy="100" r="42" fill="#D9EEF5" opacity=".55"/>
  <circle cx="-100" cy="230" r="5" fill="#7CC6DC" opacity=".6"/>
  <circle cx="-280" cy="220" r="4" fill="#2FBFAE" opacity=".45"/>
  <circle cx="830" cy="200" r="46" fill="#D9EEF5" opacity=".55"/>
  <circle cx="900" cy="70" r="5" fill="#7CC6DC" opacity=".6"/>
  <circle cx="712" cy="96" r="4" fill="#7CC6DC" opacity=".5"/>
  <!-- soft background shapes -->
  <circle cx="320" cy="150" r="126" fill="#DDEFF6"/>
  <circle cx="522" cy="212" r="28" fill="#D9EEF5" opacity=".7"/>
  <circle cx="122" cy="234" r="20" fill="#D9EEF5" opacity=".8"/>

  <!-- barn -->
  <rect x="214" y="247" width="212" height="7" rx="3.5" fill="#D9EEF5"/>
  <g filter="url(#sh)">
    <path d="M258 136L320 94L382 136V240H258Z" fill="#fff" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
  </g>
  <path d="M246 134L320 84L394 134" fill="none" stroke="#007194" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="320" cy="138" r="11" fill="#7CC6DC"/>
  <rect x="294" y="172" width="52" height="75" rx="6" fill="#1590B5"/>
  <path d="M303 181l34 57M337 181l-34 57" stroke="#fff" stroke-opacity=".6" stroke-width="4" stroke-linecap="round"/>

  <!-- ear tag badge -->
  <g filter="url(#sh)"><rect x="152" y="100" width="68" height="68" rx="18" fill="#fff"/></g>
  <g transform="rotate(-14 186 134)">
    <circle cx="186" cy="118" r="8" fill="#2FBFAE"/>
    <rect x="172" y="120" width="28" height="32" rx="9" fill="#2FBFAE"/>
    <circle cx="186" cy="118" r="3" fill="#fff"/>
    <rect x="178" y="134" width="16" height="5" rx="2.5" fill="#fff" fill-opacity=".75"/>
    <rect x="178" y="142" width="10" height="5" rx="2.5" fill="#fff" fill-opacity=".75"/>
  </g>

  <!-- route + pin -->
  <circle cx="406" cy="228" r="5" fill="#2FBFAE"/>
  <path d="M418 226C454 222 478 196 482 158" fill="none" stroke="#7CC6DC" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 10"/>
  <g filter="url(#sh)">
    <path d="M482 148c-14-16-22-27-22-38a22 22 0 0 1 44 0c0 11-8 22-22 38z" fill="#007194"/>
  </g>
  <circle cx="482" cy="110" r="8" fill="#fff"/>

  <!-- sparkles -->
  <g fill="#1590B5">
    <circle cx="214" cy="72" r="4"/><circle cx="420" cy="92" r="3"/><circle cx="196" cy="214" r="3" fill="#2FBFAE"/>
    <path d="M440 50l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#F5B041"/>
  </g>
</svg>
