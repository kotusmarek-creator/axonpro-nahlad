<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!-- card graphic: DORIS (music works documentation, royalty distribution). Background extends to -400..1040 for the wide variant -->
  <defs>
    <linearGradient id="bg" x1="-400" y1="0" x2="1040" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF5FA"/><stop offset="1" stop-color="#F6FAFC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F2E" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect x="-400" y="0" width="1440" height="300" fill="url(#bg)"/>
  <!-- soft outer shapes (wide variant) -->
  <circle cx="-190" cy="92" r="40" fill="#D9EEF5" opacity=".55"/>
  <circle cx="-80" cy="228" r="6" fill="#7CC6DC" opacity=".45"/>
  <circle cx="-262" cy="210" r="3" fill="#7CC6DC" opacity=".5"/>
  <circle cx="770" cy="214" r="44" fill="#D9EEF5" opacity=".55"/>
  <circle cx="862" cy="82" r="5" fill="#7CC6DC" opacity=".45"/>
  <circle cx="700" cy="70" r="3" fill="#7CC6DC" opacity=".5"/>
  <!-- soft background shapes -->
  <circle cx="320" cy="150" r="126" fill="#DDEFF6"/>
  <circle cx="540" cy="226" r="28" fill="#D9EEF5" opacity=".7"/>
  <circle cx="116" cy="92" r="20" fill="#D9EEF5" opacity=".8"/>

  <!-- disc -->
  <g filter="url(#sh)"><circle cx="320" cy="150" r="100" fill="#fff"/></g>
  <circle cx="320" cy="150" r="86" fill="none" stroke="#F0F6F9" stroke-width="7"/>
  <circle cx="320" cy="150" r="72" fill="none" stroke="#D9EEF5" stroke-width="2"/>
  <circle cx="320" cy="150" r="60" fill="none" stroke="#F0F6F9" stroke-width="7"/>
  <path d="M252.5 111A78 78 0 0 1 293.3 76.7" fill="none" stroke="#7CC6DC" stroke-width="5" stroke-linecap="round"/>
  <path d="M387.5 189A78 78 0 0 1 359 217.5" fill="none" stroke="#D9EEF5" stroke-width="5" stroke-linecap="round"/>
  <circle cx="320" cy="150" r="38" fill="#1590B5"/>
  <circle cx="320" cy="150" r="24" fill="#007194"/>
  <circle cx="320" cy="150" r="7" fill="#DDEFF6"/>

  <!-- music note badge -->
  <g filter="url(#sh)"><rect x="136" y="160" width="72" height="72" rx="20" fill="#fff"/></g>
  <g fill="#1590B5">
    <ellipse cx="160" cy="208" rx="8" ry="6.5" transform="rotate(-20 160 208)"/>
    <ellipse cx="186" cy="202" rx="8" ry="6.5" transform="rotate(-20 186 202)"/>
    <rect x="164" y="182" width="4.5" height="26" rx="2"/>
    <rect x="190" y="176" width="4.5" height="26" rx="2"/>
    <path d="M164 182l30.5-7v8l-30.5 7z"/>
  </g>

  <!-- share split (pie) badge -->
  <g filter="url(#sh)"><rect x="428" y="64" width="80" height="80" rx="20" fill="#fff"/></g>
  <circle cx="468" cy="104" r="22" fill="#7CC6DC"/>
  <path d="M468 104V82A22 22 0 1 1 455.1 121.8z" fill="#007194"/>
  <path d="M468 104L455.1 121.8A22 22 0 0 1 450.2 91.1z" fill="#2FBFAE"/>
  <path d="M468 104V82M468 104L455.1 121.8M468 104L450.2 91.1" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- sparkles -->
  <g fill="#1590B5">
    <circle cx="190" cy="94" r="4"/><circle cx="518" cy="176" r="3"/><circle cx="462" cy="240" r="4" fill="#2FBFAE"/>
    <path d="M232 228l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#F5B041"/>
  </g>
</svg>
