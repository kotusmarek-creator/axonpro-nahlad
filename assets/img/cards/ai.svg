<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!-- card graphic: Umelá inteligencia (AI assistant running in your network) -->
  <defs>
    <linearGradient id="bg" x1="-400" y1="0" x2="1040" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF5FA"/><stop offset="1" stop-color="#F6FAFC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F2E" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect x="-400" y="0" width="1440" height="300" fill="url(#bg)"/>
  <circle cx="320" cy="150" r="126" fill="#DDEFF6"/>
  <circle cx="130" cy="86" r="26" fill="#D9EEF5" opacity=".8"/>
  <circle cx="516" cy="232" r="24" fill="#D9EEF5" opacity=".8"/>

  <!-- chat window -->
  <g filter="url(#sh)"><rect x="214" y="54" width="212" height="192" rx="18" fill="#fff"/></g>
  <rect x="214" y="54" width="212" height="34" rx="18" fill="#F0F6F9"/>
  <rect x="214" y="72" width="212" height="16" fill="#F0F6F9"/>
  <circle cx="234" cy="71" r="5" fill="#7CC6DC"/><circle cx="250" cy="71" r="5" fill="#D9EEF5"/><circle cx="266" cy="71" r="5" fill="#D9EEF5"/>
  <!-- question bubble -->
  <rect x="300" y="102" width="110" height="34" rx="12" fill="#1590B5"/>
  <path d="M316 114h70M316 124h46" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  <!-- answer bubble with AI spark -->
  <rect x="230" y="148" width="150" height="50" rx="12" fill="#F0F6F9"/>
  <circle cx="250" cy="164" r="11" fill="#007194"/>
  <path d="M250 156l2.2 5.6 5.8 2.4-5.8 2.4-2.2 5.6-2.2-5.6-5.8-2.4 5.8-2.4z" fill="#fff"/>
  <path d="M268 162h96M268 174h70M246 186h80" stroke="#D9EEF5" stroke-width="6" stroke-linecap="round"/>
  <!-- input -->
  <rect x="230" y="210" width="180" height="22" rx="11" fill="#F0F6F9"/>
  <circle cx="398" cy="221" r="7" fill="#2FBFAE"/>

  <!-- document badge -->
  <g filter="url(#sh)"><rect x="132" y="138" width="64" height="78" rx="12" fill="#fff"/></g>
  <path d="M148 158h32M148 170h32M148 182h22" stroke="#D9EEF5" stroke-width="6" stroke-linecap="round"/>
  <rect x="148" y="194" width="20" height="8" rx="4" fill="#7CC6DC"/>

  <!-- local server badge -->
  <g filter="url(#sh)"><rect x="446" y="96" width="70" height="78" rx="14" fill="#fff"/></g>
  <rect x="458" y="108" width="46" height="16" rx="5" fill="#F0F6F9"/>
  <rect x="458" y="130" width="46" height="16" rx="5" fill="#F0F6F9"/>
  <circle cx="466" cy="116" r="3.5" fill="#2FBFAE"/><circle cx="466" cy="138" r="3.5" fill="#2FBFAE"/>
  <path d="M474 116h22M474 138h16" stroke="#1590B5" stroke-width="4" stroke-linecap="round"/>
  <path d="M470 158h22" stroke="#007194" stroke-width="5" stroke-linecap="round"/>
  <path d="M426 140h20" stroke="#7CC6DC" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6"/>

  <!-- sparkles -->
  <g fill="#1590B5">
    <circle cx="186" cy="96" r="4"/><circle cx="470" cy="68" r="3"/><circle cx="196" cy="244" r="3" fill="#2FBFAE"/>
    <path d="M472 206l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#F5B041"/>
  </g>
</svg>
