<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <defs>
    <linearGradient id="bg" x1="-400" y1="0" x2="1040" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF5FA"/><stop offset="1" stop-color="#F6FAFC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F2E" flood-opacity=".10"/>
    </filter>
  </defs>
  <!-- card graphic: Mobilné aplikácie. Content in 0..640; background extends to -400..1040 for the wide variant -->
  <rect x="-400" y="0" width="1440" height="300" fill="url(#bg)"/>
  <!-- outer decor for wide variant -->
  <circle cx="-200" cy="90" r="42" fill="#D9EEF5" opacity=".55"/>
  <circle cx="-80" cy="236" r="5" fill="#2FBFAE" opacity=".45"/>
  <circle cx="-290" cy="226" r="4" fill="#7CC6DC" opacity=".7"/>
  <circle cx="780" cy="220" r="44" fill="#D9EEF5" opacity=".55"/>
  <circle cx="700" cy="76" r="4" fill="#1590B5" opacity=".4"/>
  <circle cx="900" cy="110" r="5" fill="#7CC6DC" opacity=".7"/>
  <!-- soft background shapes -->
  <circle cx="320" cy="152" r="124" fill="#DDEFF6"/>
  <circle cx="512" cy="214" r="30" fill="#D9EEF5" opacity=".7"/>
  <circle cx="128" cy="82" r="20" fill="#D9EEF5" opacity=".8"/>

  <!-- phone -->
  <g filter="url(#sh)"><rect x="262" y="44" width="116" height="220" rx="22" fill="#fff"/></g>
  <rect x="272" y="64" width="96" height="180" rx="10" fill="#F0F6F9"/>
  <rect x="304" y="52" width="32" height="5" rx="2.5" fill="#D9EEF5"/>
  <rect x="302" y="251" width="36" height="4" rx="2" fill="#D9EEF5"/>
  <!-- app tiles -->
  <rect x="280" y="74" width="36" height="32" rx="9" fill="#007194"/>
  <rect x="324" y="74" width="36" height="32" rx="9" fill="#2FBFAE"/>
  <rect x="280" y="114" width="36" height="32" rx="9" fill="#7CC6DC"/>
  <rect x="324" y="114" width="36" height="32" rx="9" fill="#1590B5"/>
  <g fill="#fff" opacity=".85">
    <rect x="291" y="87" width="14" height="6" rx="3"/><circle cx="342" cy="90" r="5"/>
    <circle cx="298" cy="130" r="5"/><rect x="335" y="127" width="14" height="6" rx="3"/>
  </g>
  <!-- map / route card -->
  <rect x="280" y="154" width="80" height="80" rx="10" fill="#fff"/>
  <rect x="290" y="164" width="24" height="18" rx="5" fill="#DDEFF6"/>
  <rect x="326" y="200" width="26" height="24" rx="5" fill="#DDEFF6"/>
  <path d="M292 218C310 216 298 190 320 190S342 180 346 170" fill="none" stroke="#1590B5" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>
  <circle cx="292" cy="218" r="5" fill="#2FBFAE"/>
  <circle cx="346" cy="168" r="7" fill="#007194"/><circle cx="346" cy="168" r="2.8" fill="#fff"/>

  <!-- location pin badge -->
  <g filter="url(#sh)"><rect x="160" y="140" width="68" height="68" rx="18" fill="#fff"/></g>
  <path d="M194 194c-10-11-16-19-16-26a16 16 0 0 1 32 0c0 7-6 15-16 26z" fill="#007194"/>
  <circle cx="194" cy="168" r="6" fill="#fff"/>

  <!-- sync bubble -->
  <g filter="url(#sh)">
    <path d="M412 76h60a14 14 0 0 1 14 14v26a14 14 0 0 1-14 14h-46l-14 12v-12a14 14 0 0 1-14-14v-26a14 14 0 0 1 14-14z" fill="#fff"/>
  </g>
  <circle cx="424" cy="103" r="12" fill="#2FBFAE"/>
  <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M417.5 101a7 7 0 0 1 12.5-2.5"/><path d="M430.5 94.5v4.5h-4.5"/>
    <path d="M430.5 105a7 7 0 0 1-12.5 2.5"/><path d="M417.5 111.5v-4.5h4.5"/>
  </g>
  <path d="M444 97h28M444 109h20" stroke="#D9EEF5" stroke-width="7" stroke-linecap="round"/>

  <!-- sparkles -->
  <g fill="#1590B5">
    <circle cx="214" cy="100" r="4"/><circle cx="452" cy="176" r="3"/><circle cx="470" cy="240" r="4" fill="#2FBFAE"/>
    <path d="M214 228l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#F5B041"/>
  </g>
</svg>
