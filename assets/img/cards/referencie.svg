<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!-- card graphic: Referencie. Content in 0..640; background extends to -400..1040 for the wide variant -->
  <defs>
    <linearGradient id="bg" x1="-400" y1="0" x2="1040" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF5FA"/><stop offset="1" stop-color="#F6FAFC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F2E" flood-opacity=".10"/>
    </filter>
    <path id="st" d="M0-9L2.2-3.1L8.6-2.8L3.6 1.2L5.3 7.3L0 3.8L-5.3 7.3L-3.6 1.2L-8.6-2.8L-2.2-3.1Z" stroke-width="2" stroke-linejoin="round"/>
  </defs>
  <rect x="-400" y="0" width="1440" height="300" fill="url(#bg)"/>
  <!-- outer decoration for the wide variant -->
  <circle cx="-180" cy="92" r="40" fill="#D9EEF5" opacity=".55"/>
  <circle cx="-86" cy="226" r="18" fill="#D9EEF5" opacity=".7"/>
  <circle cx="-250" cy="204" r="4" fill="#7CC6DC" opacity=".7"/>
  <circle cx="-40" cy="64" r="3" fill="#7CC6DC" opacity=".7"/>
  <circle cx="790" cy="214" r="38" fill="#D9EEF5" opacity=".55"/>
  <circle cx="884" cy="84" r="20" fill="#D9EEF5" opacity=".7"/>
  <circle cx="716" cy="72" r="4" fill="#7CC6DC" opacity=".7"/>
  <circle cx="920" cy="250" r="3" fill="#2FBFAE" opacity=".6"/>
  <!-- soft background shapes -->
  <circle cx="320" cy="150" r="126" fill="#DDEFF6"/>
  <circle cx="514" cy="70" r="32" fill="#D9EEF5" opacity=".7"/>
  <circle cx="116" cy="234" r="22" fill="#D9EEF5" opacity=".8"/>
  <rect x="166" y="240" width="300" height="8" rx="4" fill="#D9EEF5"/>

  <!-- buildings -->
  <g filter="url(#sh)">
    <rect x="190" y="128" width="72" height="116" rx="12" fill="#fff"/>
    <rect x="270" y="66" width="96" height="178" rx="14" fill="#fff"/>
    <rect x="374" y="104" width="66" height="140" rx="12" fill="#fff"/>
  </g>
  <path d="M270 80a14 14 0 0 1 14-14h68a14 14 0 0 1 14 14v6H270z" fill="#F0F6F9"/>
  <g fill="#D9EEF5">
    <rect x="206" y="146" width="16" height="12" rx="3"/><rect x="230" y="146" width="16" height="12" rx="3" fill="#7CC6DC"/>
    <rect x="206" y="168" width="16" height="12" rx="3"/><rect x="230" y="168" width="16" height="12" rx="3"/>
    <rect x="206" y="190" width="16" height="12" rx="3" fill="#7CC6DC"/><rect x="230" y="190" width="16" height="12" rx="3"/>
    <rect x="286" y="100" width="16" height="12" rx="3"/><rect x="310" y="100" width="16" height="12" rx="3" fill="#7CC6DC"/><rect x="334" y="100" width="16" height="12" rx="3"/>
    <rect x="286" y="122" width="16" height="12" rx="3" fill="#1590B5"/><rect x="310" y="122" width="16" height="12" rx="3"/><rect x="334" y="122" width="16" height="12" rx="3"/>
    <rect x="286" y="144" width="16" height="12" rx="3"/><rect x="310" y="144" width="16" height="12" rx="3"/><rect x="334" y="144" width="16" height="12" rx="3" fill="#7CC6DC"/>
    <rect x="286" y="166" width="16" height="12" rx="3" fill="#7CC6DC"/><rect x="310" y="166" width="16" height="12" rx="3"/><rect x="334" y="166" width="16" height="12" rx="3"/>
    <rect x="286" y="188" width="16" height="12" rx="3"/><rect x="310" y="188" width="16" height="12" rx="3" fill="#1590B5"/><rect x="334" y="188" width="16" height="12" rx="3"/>
    <rect x="388" y="122" width="14" height="12" rx="3"/><rect x="410" y="122" width="14" height="12" rx="3"/>
    <rect x="388" y="144" width="14" height="12" rx="3" fill="#7CC6DC"/><rect x="410" y="144" width="14" height="12" rx="3"/>
    <rect x="388" y="166" width="14" height="12" rx="3"/><rect x="410" y="166" width="14" height="12" rx="3" fill="#1590B5"/>
    <rect x="388" y="188" width="14" height="12" rx="3"/><rect x="410" y="188" width="14" height="12" rx="3"/>
  </g>
  <path d="M304 244v-24a10 10 0 0 1 10-10h8a10 10 0 0 1 10 10v24z" fill="#007194"/>
  <rect x="210" y="218" width="32" height="26" rx="5" fill="#1590B5"/>

  <!-- star rating badge -->
  <g filter="url(#sh)"><rect x="128" y="76" width="124" height="40" rx="20" fill="#fff"/></g>
  <g fill="#F5B041" stroke="#F5B041">
    <use href="#st" x="150" y="96"/><use href="#st" x="174" y="96"/><use href="#st" x="198" y="96"/>
  </g>
  <use href="#st" x="222" y="96" fill="#D9EEF5" stroke="#D9EEF5"/>

  <!-- check bubble -->
  <g filter="url(#sh)">
    <path d="M436 182h70a14 14 0 0 1 14 14v26a14 14 0 0 1-14 14h-12v12l-14-12h-44a14 14 0 0 1-14-14v-26a14 14 0 0 1 14-14z" fill="#fff"/>
  </g>
  <circle cx="442" cy="209" r="11" fill="#2FBFAE"/>
  <path d="M437 209l4 4 7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M462 203h40M462 215h26" stroke="#D9EEF5" stroke-width="7" stroke-linecap="round"/>

  <!-- sparkles -->
  <g fill="#1590B5">
    <circle cx="164" cy="152" r="4"/><circle cx="470" cy="124" r="3"/><circle cx="548" cy="160" r="4" fill="#2FBFAE"/>
    <circle cx="400" cy="60" r="3" fill="#7CC6DC"/>
  </g>
</svg>
