<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!-- card graphic: Kariera. Content in 0..640; background extends to -400..1040 for the wide variant -->
  <defs>
    <linearGradient id="bg" x1="-400" y1="0" x2="1040" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF5FA"/><stop offset="1" stop-color="#F6FAFC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F2E" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect x="-400" y="0" width="1440" height="300" fill="url(#bg)"/>
  <!-- outer decoration for the wide variant -->
  <circle cx="-170" cy="210" r="40" fill="#D9EEF5" opacity=".55"/>
  <circle cx="-80" cy="76" r="18" fill="#D9EEF5" opacity=".7"/>
  <circle cx="-260" cy="84" r="4" fill="#7CC6DC" opacity=".7"/>
  <circle cx="-30" cy="250" r="3" fill="#2FBFAE" opacity=".6"/>
  <circle cx="800" cy="92" r="38" fill="#D9EEF5" opacity=".55"/>
  <circle cx="890" cy="226" r="20" fill="#D9EEF5" opacity=".7"/>
  <circle cx="724" cy="236" r="4" fill="#7CC6DC" opacity=".7"/>
  <circle cx="920" cy="60" r="3" fill="#7CC6DC" opacity=".7"/>
  <!-- soft background shapes -->
  <circle cx="320" cy="150" r="126" fill="#DDEFF6"/>
  <circle cx="530" cy="246" r="24" fill="#D9EEF5" opacity=".8"/>
  <circle cx="112" cy="88" r="22" fill="#D9EEF5" opacity=".8"/>

  <!-- person tiles -->
  <g filter="url(#sh)">
    <rect x="176" y="84" width="136" height="156" rx="18" fill="#fff"/>
    <rect x="328" y="60" width="136" height="156" rx="18" fill="#fff"/>
  </g>
  <circle cx="244" cy="140" r="40" fill="#F0F6F9"/>
  <circle cx="244" cy="127" r="15" fill="#1590B5"/>
  <path d="M220 170a24 21 0 0 1 48 0z" fill="#2FBFAE"/>
  <rect x="208" y="194" width="72" height="8" rx="4" fill="#D9EEF5"/>
  <rect x="220" y="210" width="48" height="8" rx="4" fill="#F0F6F9"/>

  <circle cx="396" cy="116" r="40" fill="#F0F6F9"/>
  <circle cx="396" cy="103" r="15" fill="#7CC6DC"/>
  <path d="M372 146a24 21 0 0 1 48 0z" fill="#007194"/>
  <rect x="360" y="170" width="72" height="8" rx="4" fill="#D9EEF5"/>
  <rect x="372" y="186" width="48" height="8" rx="4" fill="#F0F6F9"/>

  <!-- plus badge -->
  <g filter="url(#sh)"><circle cx="458" cy="68" r="19" fill="#fff"/></g>
  <circle cx="458" cy="68" r="14" fill="#2FBFAE"/>
  <path d="M458 61v14M451 68h14" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- rising arrow tile -->
  <g filter="url(#sh)"><rect x="420" y="178" width="88" height="64" rx="16" fill="#fff"/></g>
  <path d="M438 226l16-14 10 8 22-21" fill="none" stroke="#1590B5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M476 199h11v11" fill="none" stroke="#1590B5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sparkles -->
  <g fill="#1590B5">
    <circle cx="152" cy="138" r="4"/><circle cx="500" cy="134" r="3"/><circle cx="150" cy="226" r="4" fill="#2FBFAE"/>
    <path d="M520 92l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#F5B041"/>
  </g>
</svg>
