<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!-- card graphic: Strategia. Content in 0..640; background extends to -400..1040 for the wide variant -->
  <defs>
    <linearGradient id="bg" x1="-400" y1="0" x2="1040" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF5FA"/><stop offset="1" stop-color="#F6FAFC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F2E" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect x="-400" y="0" width="1440" height="300" fill="url(#bg)"/>
  <!-- soft background shapes -->
  <circle cx="-170" cy="100" r="40" fill="#D9EEF5" opacity=".5"/>
  <circle cx="-270" cy="226" r="14" fill="#D9EEF5" opacity=".6"/>
  <circle cx="-70" cy="214" r="4" fill="#7CC6DC" opacity=".6"/>
  <circle cx="780" cy="210" r="36" fill="#D9EEF5" opacity=".5"/>
  <circle cx="880" cy="88" r="16" fill="#D9EEF5" opacity=".6"/>
  <circle cx="700" cy="80" r="4" fill="#7CC6DC" opacity=".6"/>
  <circle cx="322" cy="150" r="128" fill="#DDEFF6"/>
  <circle cx="126" cy="96" r="24" fill="#D9EEF5" opacity=".8"/>
  <circle cx="522" cy="238" r="20" fill="#D9EEF5" opacity=".7"/>

  <!-- target tile -->
  <g filter="url(#sh)"><rect x="230" y="58" width="184" height="184" rx="26" fill="#fff"/></g>
  <circle cx="322" cy="150" r="70" fill="#D9EEF5"/>
  <circle cx="322" cy="150" r="54" fill="#fff"/>
  <circle cx="322" cy="150" r="40" fill="#7CC6DC"/>
  <circle cx="322" cy="150" r="26" fill="#fff"/>
  <circle cx="322" cy="150" r="13" fill="#007194"/>

  <!-- arrow in the bullseye -->
  <g transform="translate(322 150) rotate(-39.2)">
    <path d="M14 0H122" stroke="#007194" stroke-width="6" stroke-linecap="round"/>
    <path d="M3 0L18 -8V8Z" fill="#007194"/>
    <path d="M100 0L112 -13H136L124 0Z" fill="#2FBFAE"/>
    <path d="M100 0L112 13H136L124 0Z" fill="#1590B5"/>
  </g>

  <!-- progress pill -->
  <g filter="url(#sh)"><rect x="156" y="118" width="58" height="28" rx="14" fill="#fff"/></g>
  <circle cx="171" cy="132" r="5" fill="#2FBFAE"/>
  <circle cx="185" cy="132" r="5" fill="#2FBFAE"/>
  <circle cx="199" cy="132" r="5" fill="#D9EEF5"/>

  <!-- rising bar chart badge -->
  <g filter="url(#sh)"><rect x="394" y="174" width="84" height="70" rx="18" fill="#fff"/></g>
  <rect x="408" y="214" width="10" height="16" rx="3" fill="#7CC6DC"/>
  <rect x="424" y="206" width="10" height="24" rx="3" fill="#7CC6DC"/>
  <rect x="440" y="196" width="10" height="34" rx="3" fill="#1590B5"/>
  <rect x="456" y="186" width="10" height="44" rx="3" fill="#007194"/>

  <!-- sparkles -->
  <g fill="#1590B5">
    <circle cx="188" cy="206" r="4"/><circle cx="460" cy="120" r="3"/><circle cx="514" cy="96" r="4" fill="#2FBFAE"/>
    <path d="M494 146l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#F5B041"/>
  </g>
</svg>
