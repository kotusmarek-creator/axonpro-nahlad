<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!-- card graphic: Linux & open source. Content in 0..640; background extends to -400..1040 for the wide variant -->
  <defs>
    <linearGradient id="bg" x1="-400" y1="0" x2="1040" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF5FA"/><stop offset="1" stop-color="#F6FAFC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F2E" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect x="-400" y="0" width="1440" height="300" fill="url(#bg)"/>
  <!-- outer decor (wide variant) -->
  <circle cx="-210" cy="84" r="46" fill="#D9EEF5" opacity=".5"/>
  <circle cx="-90" cy="230" r="18" fill="#D9EEF5" opacity=".7"/>
  <circle cx="-260" cy="210" r="4" fill="#7CC6DC" opacity=".7"/>
  <circle cx="780" cy="220" r="40" fill="#D9EEF5" opacity=".5"/>
  <circle cx="880" cy="80" r="20" fill="#D9EEF5" opacity=".7"/>
  <circle cx="720" cy="70" r="4" fill="#7CC6DC" opacity=".7"/>
  <!-- soft background shapes -->
  <circle cx="320" cy="150" r="126" fill="#DDEFF6"/>
  <circle cx="512" cy="70" r="32" fill="#D9EEF5" opacity=".7"/>
  <circle cx="124" cy="96" r="20" fill="#D9EEF5" opacity=".8"/>

  <!-- terminal window -->
  <g filter="url(#sh)"><rect x="200" y="64" width="250" height="172" rx="16" fill="#fff"/></g>
  <path d="M200 80a16 16 0 0 1 16-16h218a16 16 0 0 1 16 16v14H200z" fill="#F0F6F9"/>
  <circle cx="220" cy="79" r="4.5" fill="#F5B041"/>
  <circle cx="235" cy="79" r="4.5" fill="#7CC6DC"/>
  <circle cx="250" cy="79" r="4.5" fill="#2FBFAE"/>
  <path d="M222 112l9 7-9 7M222 148l9 7-9 7M222 184l9 7-9 7" fill="none" stroke="#2FBFAE" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke-linecap="round" stroke-width="9">
    <path d="M246 119h56" stroke="#007194"/><path d="M314 119h70" stroke="#7CC6DC"/>
    <path d="M246 137h110" stroke="#D9EEF5"/>
    <path d="M246 155h40" stroke="#1590B5"/><path d="M298 155h50" stroke="#7CC6DC"/><path d="M360 155h40" stroke="#D9EEF5"/>
    <path d="M246 173h78" stroke="#D9EEF5"/>
  </g>
  <rect x="244" y="184" width="14" height="14" rx="3" fill="#007194"/>

  <!-- gear tile -->
  <g filter="url(#sh)"><rect x="410" y="172" width="76" height="76" rx="20" fill="#fff"/></g>
  <g transform="translate(448 210) rotate(12) scale(.86)">
    <path d="M22.4 -5.0L29.7 -3.9L29.7 3.9L22.4 5.0L19.4 12.3L23.8 18.3L18.3 23.8L12.3 19.4L5.0 22.4L3.9 29.7L-3.9 29.7L-5.0 22.4L-12.3 19.4L-18.3 23.8L-23.8 18.3L-19.4 12.3L-22.4 5.0L-29.7 3.9L-29.7 -3.9L-22.4 -5.0L-19.4 -12.3L-23.8 -18.3L-18.3 -23.8L-12.3 -19.4L-5.0 -22.4L-3.9 -29.7L3.9 -29.7L5.0 -22.4L12.3 -19.4L18.3 -23.8L23.8 -18.3L19.4 -12.3Z" fill="#1590B5"/>
    <circle r="16" fill="#1590B5"/>
    <circle r="9" fill="#fff"/>
  </g>

  <!-- status pill -->
  <g filter="url(#sh)"><rect x="148" y="176" width="74" height="34" rx="17" fill="#fff"/></g>
  <circle cx="166" cy="193" r="7" fill="#2FBFAE"/>
  <path d="M180 193h28" stroke="#D9EEF5" stroke-width="7" stroke-linecap="round"/>

  <!-- sparkles -->
  <g fill="#1590B5">
    <circle cx="172" cy="140" r="4"/><circle cx="476" cy="122" r="3"/><circle cx="530" cy="168" r="4" fill="#2FBFAE"/>
    <path d="M480 66l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#F5B041"/>
  </g>
</svg>
