<svg xmlns="http://www.w3.org/2000/svg" viewBox="-320 0 1280 300" width="1280" height="300">
  <!-- card graphic: ITMS. Content in 0..640; background extends to -400..1040 for the wide variant -->
  <defs>
    <linearGradient id="bg" x1="-400" y1="0" x2="1040" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF5FA"/><stop offset="1" stop-color="#F6FAFC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F2E" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect x="-400" y="0" width="1440" height="300" fill="url(#bg)"/>
  <!-- outer decor for the wide variant -->
  <circle cx="-180" cy="210" r="42" fill="#D9EEF5" opacity=".55"/>
  <circle cx="-90" cy="80" r="5" fill="#7CC6DC" opacity=".6"/>
  <circle cx="-270" cy="110" r="4" fill="#2FBFAE" opacity=".45"/>
  <circle cx="810" cy="96" r="44" fill="#D9EEF5" opacity=".55"/>
  <circle cx="900" cy="226" r="5" fill="#7CC6DC" opacity=".6"/>
  <circle cx="716" cy="236" r="4" fill="#7CC6DC" opacity=".5"/>
  <!-- soft background shapes -->
  <circle cx="320" cy="150" r="126" fill="#DDEFF6"/>
  <circle cx="514" cy="70" r="30" fill="#D9EEF5" opacity=".7"/>
  <circle cx="120" cy="96" r="20" fill="#D9EEF5" opacity=".8"/>

  <!-- form document -->
  <g filter="url(#sh)"><rect x="240" y="48" width="160" height="206" rx="16" fill="#fff"/></g>
  <rect x="262" y="70" width="64" height="10" rx="5" fill="#007194"/>
  <rect x="334" y="70" width="28" height="10" rx="5" fill="#D9EEF5"/>
  <rect x="262" y="98" width="38" height="7" rx="3.5" fill="#7CC6DC"/>
  <rect x="262" y="111" width="116" height="22" rx="7" fill="#F0F6F9"/>
  <rect x="272" y="118.5" width="54" height="7" rx="3.5" fill="#1590B5"/>
  <rect x="262" y="145" width="50" height="7" rx="3.5" fill="#7CC6DC"/>
  <rect x="262" y="158" width="116" height="22" rx="7" fill="#F0F6F9"/>
  <rect x="272" y="165.5" width="76" height="7" rx="3.5" fill="#1590B5"/>
  <rect x="262" y="194" width="14" height="14" rx="4" fill="#2FBFAE"/>
  <path d="M265.5 201l2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="284" y="197.5" width="52" height="7" rx="3.5" fill="#D9EEF5"/>
  <rect x="262" y="218" width="14" height="14" rx="4" fill="#D9EEF5"/>
  <rect x="284" y="221.5" width="38" height="7" rx="3.5" fill="#D9EEF5"/>

  <!-- approval stamp -->
  <g filter="url(#sh)"><circle cx="404" cy="212" r="34" fill="#fff"/></g>
  <circle cx="404" cy="212" r="25" fill="#2FBFAE"/>
  <circle cx="404" cy="212" r="19" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
  <path d="M394 212l7 7 13-14" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- coins -->
  <g filter="url(#sh)">
    <circle cx="190" cy="176" r="22" fill="#F5B041"/>
    <circle cx="166" cy="214" r="20" fill="#2FBFAE"/>
  </g>
  <circle cx="190" cy="176" r="14" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3"/>
  <circle cx="166" cy="214" r="12.5" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3"/>

  <!-- sparkles -->
  <g fill="#1590B5">
    <circle cx="200" cy="80" r="4"/><circle cx="448" cy="124" r="3"/><circle cx="476" cy="252" r="4" fill="#2FBFAE"/>
    <path d="M438 66l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#7CC6DC"/>
  </g>
</svg>
