<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!-- card graphic: EWA (early warning of Alzheimer via speech, telemedicine). Background extends to -400..1040 for the wide variant -->
  <defs>
    <linearGradient id="bg" x1="-400" y1="0" x2="1040" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF5FA"/><stop offset="1" stop-color="#F6FAFC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F2E" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect x="-400" y="0" width="1440" height="300" fill="url(#bg)"/>
  <!-- soft outer shapes (wide variant) -->
  <circle cx="-200" cy="210" r="42" fill="#D9EEF5" opacity=".55"/>
  <circle cx="-90" cy="76" r="5" fill="#7CC6DC" opacity=".45"/>
  <circle cx="-270" cy="92" r="3" fill="#7CC6DC" opacity=".5"/>
  <circle cx="780" cy="88" r="40" fill="#D9EEF5" opacity=".55"/>
  <circle cx="870" cy="226" r="6" fill="#7CC6DC" opacity=".45"/>
  <circle cx="696" cy="240" r="3" fill="#7CC6DC" opacity=".5"/>
  <!-- soft background shapes -->
  <circle cx="322" cy="150" r="126" fill="#DDEFF6"/>
  <circle cx="514" cy="66" r="32" fill="#D9EEF5" opacity=".7"/>
  <circle cx="120" cy="250" r="18" fill="#D9EEF5" opacity=".8"/>

  <!-- tablet -->
  <g filter="url(#sh)"><rect x="200" y="60" width="244" height="172" rx="18" fill="#fff"/></g>
  <rect x="214" y="76" width="216" height="140" rx="10" fill="#F0F6F9"/>
  <circle cx="322" cy="68" r="2.5" fill="#D9EEF5"/>
  <path d="M228 140h26l8-18 10 38 10-60 10 72 10-48 8 16h10l6-10 6 10h36" fill="none" stroke="#1590B5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke-linecap="round" stroke-width="6">
    <path d="M232 196h40" stroke="#007194"/><path d="M282 196h58" stroke="#D9EEF5"/>
    <path d="M350 196h22" stroke="#7CC6DC"/>
  </g>

  <!-- brain badge -->
  <g filter="url(#sh)"><rect x="134" y="148" width="72" height="72" rx="20" fill="#fff"/></g>
  <path d="M168 166C160 162 151 166 151 174C145 177 145 188 150 191C149 199 157 204 164 201C165 203 168 203 168 203Z" fill="#1590B5"/>
  <path d="M172 166C180 162 189 166 189 174C195 177 195 188 190 191C191 199 183 204 176 201C175 203 172 203 172 203Z" fill="#007194"/>
  <path d="M160 170q5 5 0 11M154 186q7-1 10 5M180 170q-5 5 0 11M186 186q-7-1-10 5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- check bubble -->
  <g filter="url(#sh)">
    <path d="M398 196h76a14 14 0 0 1 14 14v26a14 14 0 0 1-14 14h-50l-14 12v-12h-12a14 14 0 0 1-14-14v-26a14 14 0 0 1 14-14z" fill="#fff"/>
  </g>
  <circle cx="414" cy="223" r="11" fill="#2FBFAE"/>
  <path d="M409 223l4 4 7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M434 217h38M434 229h26" stroke="#D9EEF5" stroke-width="7" stroke-linecap="round"/>

  <!-- sparkles -->
  <g fill="#1590B5">
    <circle cx="180" cy="98" r="4"/><circle cx="476" cy="112" r="3"/><circle cx="252" cy="258" r="3.5" fill="#2FBFAE"/>
    <path d="M506 150l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#F5B041"/>
  </g>
</svg>
