<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!-- card graphic: Zosuvy. Content in 0..640; background extends to -400..1040 for the wide variant -->
  <defs>
    <linearGradient id="bg" x1="-400" y1="0" x2="1040" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF5FA"/><stop offset="1" stop-color="#F6FAFC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F2E" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect x="-400" y="0" width="1440" height="300" fill="url(#bg)"/>
  <!-- soft background shapes -->
  <circle cx="-190" cy="92" r="40" fill="#D9EEF5" opacity=".5"/>
  <circle cx="-70" cy="226" r="16" fill="#D9EEF5" opacity=".6"/>
  <circle cx="-262" cy="210" r="4" fill="#7CC6DC" opacity=".6"/>
  <circle cx="770" cy="214" r="36" fill="#D9EEF5" opacity=".5"/>
  <circle cx="868" cy="84" r="16" fill="#D9EEF5" opacity=".6"/>
  <circle cx="702" cy="96" r="4" fill="#7CC6DC" opacity=".6"/>
  <circle cx="326" cy="150" r="126" fill="#DDEFF6"/>
  <circle cx="522" cy="70" r="30" fill="#D9EEF5" opacity=".7"/>
  <circle cx="124" cy="236" r="20" fill="#D9EEF5" opacity=".8"/>

  <!-- hill -->
  <g filter="url(#sh)">
    <path d="M170 236C210 200 250 110 320 96C370 88 400 130 430 170C450 196 470 220 490 236Z" fill="#fff"/>
    <rect x="150" y="226" width="360" height="22" rx="11" fill="#fff"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="5">
    <path d="M206 214C240 196 280 188 320 190C370 192 410 204 446 214" stroke="#D9EEF5"/>
    <path d="M236 176C270 160 300 154 330 156C370 158 400 168 428 180" stroke="#7CC6DC"/>
    <path d="M268 134C290 124 310 120 330 122C352 124 372 132 388 142" stroke="#D9EEF5"/>
  </g>

  <!-- movement arrow + sliding rocks -->
  <path d="M392 104C430 122 458 160 480 192" fill="none" stroke="#1590B5" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
  <path d="M469.5 190.2L482 196L480.9 182.2" fill="none" stroke="#1590B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="502" cy="224" r="9" fill="#7CC6DC"/>
  <circle cx="522" cy="236" r="6" fill="#1590B5"/>

  <!-- sensor pin with signal -->
  <ellipse cx="290" cy="152" rx="11" ry="3.5" fill="#7CC6DC"/>
  <g filter="url(#sh)">
    <path d="M290 150c-4-10-18-20-18-34a18 18 0 0 1 36 0c0 14-14 24-18 34z" fill="#007194"/>
  </g>
  <circle cx="290" cy="116" r="7" fill="#fff"/>
  <g fill="none" stroke-linecap="round" stroke-width="4">
    <path d="M267.1 99.9A28 28 0 0 1 282.7 88.9" stroke="#2FBFAE"/>
    <path d="M258.9 94.2A38 38 0 0 1 280.2 79.3" stroke="#7CC6DC"/>
  </g>

  <!-- satellite badge -->
  <g filter="url(#sh)"><rect x="150" y="62" width="72" height="72" rx="18" fill="#fff"/></g>
  <g transform="translate(186 96) rotate(-30)">
    <path d="M-12 0H12" stroke="#007194" stroke-width="3"/>
    <rect x="-29" y="-6" width="17" height="12" rx="2.5" fill="#7CC6DC"/>
    <rect x="12" y="-6" width="17" height="12" rx="2.5" fill="#7CC6DC"/>
    <rect x="-7" y="-8" width="14" height="16" rx="3.5" fill="#1590B5"/>
    <path d="M0 8v5" stroke="#007194" stroke-width="3" stroke-linecap="round"/>
    <path d="M-7 15a7 5 0 0 0 14 0z" fill="#007194"/>
  </g>

  <!-- sparkles -->
  <g fill="#1590B5">
    <circle cx="176" cy="172" r="4"/><circle cx="520" cy="136" r="3"/><circle cx="556" cy="200" r="4" fill="#2FBFAE"/>
    <path d="M430 66l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#F5B041"/>
  </g>
</svg>
