<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!-- card graphic: Kybernetická bezpečnosť (audit, tests, protection) -->
  <defs>
    <linearGradient id="bg" x1="-400" y1="0" x2="1040" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF5FA"/><stop offset="1" stop-color="#F6FAFC"/>
    </linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1590B5"/><stop offset="1" stop-color="#005A77"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F2E" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect x="-400" y="0" width="1440" height="300" fill="url(#bg)"/>
  <circle cx="320" cy="150" r="126" fill="#DDEFF6"/>
  <circle cx="132" cy="226" r="24" fill="#D9EEF5" opacity=".8"/>
  <circle cx="514" cy="80" r="26" fill="#D9EEF5" opacity=".8"/>
  <!-- scan rings -->
  <circle cx="320" cy="146" r="104" fill="none" stroke="#7CC6DC" stroke-width="3" stroke-dasharray="3 10" stroke-linecap="round"/>

  <!-- shield -->
  <g filter="url(#sh)">
    <path d="M320 48l78 28v58c0 52-34 88-78 106-44-18-78-54-78-106V76z" fill="#fff"/>
  </g>
  <path d="M320 72l56 20v42c0 38-24 64-56 78-32-14-56-40-56-78V92z" fill="url(#sg)"/>
  <path d="M296 140l17 17 33-36" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- lock badge -->
  <g filter="url(#sh)"><rect x="150" y="96" width="70" height="70" rx="18" fill="#fff"/></g>
  <rect x="168" y="126" width="34" height="26" rx="6" fill="#1590B5"/>
  <path d="M174 126v-7a11 11 0 0 1 22 0v7" fill="none" stroke="#1590B5" stroke-width="5"/>
  <circle cx="185" cy="139" r="4" fill="#fff"/>

  <!-- audit checklist bubble -->
  <g filter="url(#sh)"><rect x="420" y="146" width="104" height="86" rx="16" fill="#fff"/></g>
  <circle cx="440" cy="168" r="7" fill="#2FBFAE"/><path d="M437 168l2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="440" cy="190" r="7" fill="#2FBFAE"/><path d="M437 190l2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="440" cy="212" r="7" fill="#F5B041"/>
  <path d="M454 168h52M454 190h40M454 212h46" stroke="#D9EEF5" stroke-width="6" stroke-linecap="round"/>

  <!-- sparkles -->
  <g fill="#1590B5">
    <circle cx="200" cy="214" r="4"/><circle cx="452" cy="102" r="3"/><circle cx="176" cy="70" r="3" fill="#2FBFAE"/>
    <path d="M232 246l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#7CC6DC"/>
  </g>
</svg>
