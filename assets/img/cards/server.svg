<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!-- card graphic: Správa IT. Content in 0..640; background extends to -400..1040 for the wide variant -->
  <defs>
    <linearGradient id="bg" x1="-400" y1="0" x2="1040" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF5FA"/><stop offset="1" stop-color="#F6FAFC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F2E" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect x="-400" y="0" width="1440" height="300" fill="url(#bg)"/>
  <!-- outer decor for the wide variant -->
  <circle cx="-190" cy="92" r="40" fill="#D9EEF5" opacity=".55"/>
  <circle cx="-96" cy="226" r="5" fill="#7CC6DC" opacity=".6"/>
  <circle cx="-260" cy="200" r="4" fill="#7CC6DC" opacity=".5"/>
  <circle cx="820" cy="214" r="46" fill="#D9EEF5" opacity=".55"/>
  <circle cx="890" cy="78" r="5" fill="#7CC6DC" opacity=".6"/>
  <circle cx="720" cy="110" r="4" fill="#2FBFAE" opacity=".45"/>
  <!-- soft background shapes -->
  <circle cx="320" cy="150" r="126" fill="#DDEFF6"/>
  <circle cx="512" cy="64" r="30" fill="#D9EEF5" opacity=".7"/>
  <circle cx="124" cy="240" r="20" fill="#D9EEF5" opacity=".8"/>

  <!-- server rack -->
  <rect x="272" y="244" width="22" height="14" rx="5" fill="#7CC6DC"/>
  <rect x="346" y="244" width="22" height="14" rx="5" fill="#7CC6DC"/>
  <g filter="url(#sh)"><rect x="250" y="50" width="140" height="200" rx="18" fill="#fff"/></g>
  <rect x="266" y="68" width="108" height="48" rx="10" fill="#F0F6F9"/>
  <rect x="266" y="126" width="108" height="48" rx="10" fill="#F0F6F9"/>
  <rect x="266" y="184" width="108" height="48" rx="10" fill="#F0F6F9"/>
  <circle cx="284" cy="92" r="5" fill="#2FBFAE"/><circle cx="300" cy="92" r="5" fill="#7CC6DC"/>
  <circle cx="284" cy="150" r="5" fill="#2FBFAE"/><circle cx="300" cy="150" r="5" fill="#F5B041"/>
  <circle cx="284" cy="208" r="5" fill="#2FBFAE"/><circle cx="300" cy="208" r="5" fill="#7CC6DC"/>
  <g stroke-linecap="round" stroke-width="7">
    <path d="M320 86h38" stroke="#1590B5"/><path d="M320 99h24" stroke="#D9EEF5"/>
    <path d="M320 144h38" stroke="#007194"/><path d="M320 157h24" stroke="#D9EEF5"/>
    <path d="M320 202h38" stroke="#1590B5"/><path d="M320 215h24" stroke="#D9EEF5"/>
  </g>

  <!-- wrench badge -->
  <g filter="url(#sh)"><rect x="152" y="140" width="68" height="68" rx="18" fill="#fff"/></g>
  <g transform="translate(186 176) rotate(45)">
    <rect x="-5" y="-4" width="10" height="28" rx="5" fill="#1590B5"/>
    <circle cx="0" cy="-12" r="13" fill="#1590B5"/>
    <rect x="-4.5" y="-28" width="9" height="14" rx="2" fill="#fff"/>
  </g>

  <!-- check bubble -->
  <g transform="translate(22 -32)">
    <g filter="url(#sh)">
      <path d="M398 196h76a14 14 0 0 1 14 14v26a14 14 0 0 1-14 14h-50l-14 12v-12h-12a14 14 0 0 1-14-14v-26a14 14 0 0 1 14-14z" fill="#fff"/>
    </g>
    <circle cx="414" cy="223" r="11" fill="#2FBFAE"/>
    <path d="M409 223l4 4 7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M434 217h38M434 229h26" stroke="#D9EEF5" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- sparkles -->
  <g fill="#1590B5">
    <circle cx="190" cy="92" r="4"/><circle cx="430" cy="98" r="3"/><circle cx="470" cy="250" r="4" fill="#2FBFAE"/>
    <path d="M214 236l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#7CC6DC"/>
  </g>
</svg>
