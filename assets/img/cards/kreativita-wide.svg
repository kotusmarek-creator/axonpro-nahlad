<svg xmlns="http://www.w3.org/2000/svg" viewBox="-320 0 1280 300" width="1280" height="300">
  <!-- card graphic: Kreativita. Content in 0..640; background extends to -400..1040 for the wide variant -->
  <defs>
    <linearGradient id="bg" x1="-400" y1="0" x2="1040" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF5FA"/><stop offset="1" stop-color="#F6FAFC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F2E" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect x="-400" y="0" width="1440" height="300" fill="url(#bg)"/>
  <!-- soft background shapes -->
  <circle cx="-150" cy="214" r="38" fill="#D9EEF5" opacity=".5"/>
  <circle cx="-250" cy="78" r="14" fill="#D9EEF5" opacity=".6"/>
  <circle cx="-60" cy="96" r="4" fill="#7CC6DC" opacity=".6"/>
  <circle cx="800" cy="96" r="38" fill="#D9EEF5" opacity=".5"/>
  <circle cx="700" cy="226" r="14" fill="#D9EEF5" opacity=".6"/>
  <circle cx="900" cy="214" r="4" fill="#7CC6DC" opacity=".6"/>
  <circle cx="320" cy="150" r="126" fill="#DDEFF6"/>
  <circle cx="524" cy="78" r="30" fill="#D9EEF5" opacity=".7"/>
  <circle cx="120" cy="92" r="20" fill="#D9EEF5" opacity=".8"/>

  <!-- rays -->
  <g stroke="#1590B5" stroke-width="6" stroke-linecap="round">
    <path d="M246 124H230"/><path d="M259.4 81.5L247.9 73.5"/><path d="M320 52V40"/>
    <path d="M380.6 81.5L392.1 73.5"/><path d="M394 124H410"/>
  </g>

  <!-- lightbulb -->
  <g filter="url(#sh)">
    <circle cx="320" cy="124" r="60" fill="#fff"/>
    <rect x="294" y="164" width="52" height="34" rx="10" fill="#fff"/>
  </g>
  <path d="M285.4 104A40 40 0 0 1 306.3 86.4" fill="none" stroke="#D9EEF5" stroke-width="7" stroke-linecap="round"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 132V170M340 144V170" stroke="#7CC6DC" stroke-width="4"/>
    <path d="M300 132l8 12 8-12 8 12 8-12 8 12" stroke="#F5B041" stroke-width="5"/>
  </g>
  <rect x="298" y="200" width="44" height="10" rx="5" fill="#7CC6DC"/>
  <rect x="302" y="213" width="36" height="10" rx="5" fill="#1590B5"/>
  <rect x="310" y="226" width="20" height="8" rx="4" fill="#007194"/>

  <!-- pen nib tile -->
  <g filter="url(#sh)"><rect x="150" y="152" width="70" height="70" rx="18" fill="#fff"/></g>
  <g transform="translate(186 186) rotate(45)">
    <path d="M-11 -6L0 22L11 -6L6 -15H-6Z" fill="#1590B5"/>
    <rect x="-7" y="-24" width="14" height="7" rx="2" fill="#007194"/>
    <path d="M0 21V5" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cy="2" r="3" fill="#fff"/>
  </g>

  <!-- colour palette badge -->
  <g filter="url(#sh)"><rect x="410" y="178" width="94" height="52" rx="16" fill="#fff"/></g>
  <circle cx="434" cy="204" r="9" fill="#2FBFAE"/>
  <circle cx="457" cy="204" r="9" fill="#1590B5"/>
  <circle cx="480" cy="204" r="9" fill="#007194"/>

  <!-- sparkles -->
  <g fill="#1590B5">
    <circle cx="176" cy="112" r="4"/><circle cx="512" cy="146" r="3"/><circle cx="240" cy="240" r="3" fill="#2FBFAE"/>
    <path d="M440 56l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#2FBFAE"/>
  </g>
</svg>
